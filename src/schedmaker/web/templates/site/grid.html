{% extends "site/base.html" %}
{% block title %}{{ grid.title }}{% endblock %}
{% block content %}
<h1>{{ grid.title }}</h1>
<p class="subtitle">{{ grid.subtitle }}</p>
<div class="filters no-print">
  <a class="btn secondary" href="{{ root }}index.html">← Ко всем расписаниям</a>
  {% if ics_name %}<a class="btn secondary" href="{{ ics_name }}">Добавить в календарь (.ics)</a>{% endif %}
  <button class="secondary" onclick="window.print()">Печать / PDF</button>
</div>
{% include "_grid.html" %}
{% endblock %}
