[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "schedule-maker"
version = "0.1.0"
description = "Модульная система автоматического составления расписания занятий вуза"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "jinja2>=3.1",
    "sqlalchemy>=2.0",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "python-multipart>=0.0.9",
    "itsdangerous>=2.2",
    "openpyxl>=3.1",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
cpsat = ["ortools>=9.10"]
dev = [
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "httpx>=0.27",
    "ruff>=0.16.7",
    "mypy>=1.11",
    "types-pyyaml",
]

[project.scripts]
schedmaker = "schedmaker.cli:main"

# --- Точки расширения: ядро находит плагины только через них. ---
# Сторонний пакет объявляет такие же группы и попадает в программу без правки ядра.
[project.entry-points."schedmaker.constraints"]
core = "schedmaker.plugins.builtin.constraints_core:register"
teacher = "schedmaker.plugins.builtin.constraints_teacher:register"
lesson = "schedmaker.plugins.builtin.constraints_lesson:register"

[project.entry-points."schedmaker.solvers"]
greedy = "schedmaker.plugins.builtin.solver_greedy:register"
cpsat = "schedmaker.plugins.builtin.solver_cpsat:register"

[project.entry-points."schedmaker.importers"]
excel = "schedmaker.plugins.builtin.importer_excel:register"

[project.entry-points."schedmaker.exporters"]
ics = "schedmaker.plugins.builtin.exporter_ics:register"
xlsx = "schedmaker.plugins.builtin.exporter_xlsx:register"
html = "schedmaker.plugins.builtin.exporter_html:register"

[project.entry-points."schedmaker.reports"]
workload = "schedmaker.plugins.builtin.report_workload:register"
rooms = "schedmaker.plugins.builtin.report_rooms:register"

[project.entry-points."schedmaker.external"]
manual = "schedmaker.plugins.builtin.external_manual:register"

[tool.hatch.build.targets.wheel]
packages = ["src/schedmaker"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003", "B008"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["error::DeprecationWarning:schedmaker.*"]

[tool.mypy]
python_version = "3.11"
packages = ["schedmaker"]
ignore_missing_imports = true
