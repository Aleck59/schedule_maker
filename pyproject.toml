[project]
name = "schedule-maker"
version = "0.1.0"
description = "Модульная веб-система автоматизации составления расписания вуза"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Aleck59" }]
keywords = ["timetable", "scheduling", "university", "fastapi"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Framework :: FastAPI",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Natural Language :: Russian",
]
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy>=2.0.36",
    "alembic>=1.14",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "jinja2>=3.1.4",
    "python-multipart>=0.0.17",
    "itsdangerous>=2.2",
    "argon2-cffi>=23.1",
    "httpx>=0.27",
    "openpyxl>=3.1",
    "typer>=0.15",
]

[project.optional-dependencies]
# Чтение учебного плана из PDF. Вынесено отдельно: библиотека тяжёлая,
# а без загрузки планов программа работает полностью.
plan = [
    "pdfplumber>=0.11",
]
dev = [
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "ruff>=0.8",
    "mypy>=1.13",
    "types-openpyxl",
    "pdfplumber>=0.11",
]

[project.scripts]
sm = "schedule_maker.cli:app"

# Точка расширения: сторонние плагины регистрируются в этой группе.
# [project.entry-points."schedule_maker.plugins"]
# my_rule = "my_package.plugin:register"

[project.urls]
Homepage = "https://github.com/Aleck59/schedule_maker"
Source = "https://github.com/Aleck59/schedule_maker"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/schedule_maker"]
# Миграции обязаны ехать вместе с кодом. Пока они лежали вне пакета,
# установленная программа не умела обновлять схему и молча создавала
# её заново — с недостающими колонками в старых таблицах.
artifacts = [
    "src/schedule_maker/migrations/**",
    "src/schedule_maker/web/static/**",
    "src/schedule_maker/web/templates/**",
    "src/schedule_maker/plugins/builtin/*/templates/**",
]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]
# Файлы миграций генерируются автоматически, переформатировать их бессмысленно.
# Примеры кода в документации выровнены по смыслу, а не по правилам форматтера.
extend-exclude = ["src/schedule_maker/migrations/versions", "*.md"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C4", "SIM", "RUF"]
ignore = ["B008", "RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.isort]
known-first-party = ["schedule_maker", "tests"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]

[tool.mypy]
python_version = "3.11"
files = ["src/schedule_maker"]
ignore_missing_imports = true
warn_unused_ignores = false
disallow_untyped_defs = false

[tool.pytest.ini_options]
testpaths = ["tests"]
# Корень проекта в пути импорта: тесты берут помощников из tests.factories,
# а консольная команда pytest, в отличие от «python -m pytest», сама его
# туда не добавляет.
pythonpath = ["."]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning"]
