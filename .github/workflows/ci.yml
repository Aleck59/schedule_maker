# Единый workflow: проверки, сборка и релиз.
# Обычный push/PR -> lint + test + build.
# Тег vX.Y.Z        -> дополнительно job release (GitHub Release + образ в GHCR).
name: CI & Release

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  PYTHON_DEFAULT: "3.12"

jobs:
  lint:
    name: Линтеры и типы
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Установка зависимостей
        run: uv sync --extra dev
      - name: ruff check
        run: uv run ruff check .
      - name: ruff format --check
        run: uv run ruff format --check .
      - name: mypy
        run: uv run mypy

  test:
    name: Тесты (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Установка зависимостей
        run: uv sync --extra dev --python ${{ matrix.python-version }}
      - name: pytest
        run: uv run pytest --cov=schedule_maker --cov-report=term-missing --cov-report=xml
      - name: Выгрузка отчёта о покрытии
        if: matrix.python-version == '3.12'
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.xml
          if-no-files-found: ignore

  build:
    name: Сборка пакета
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Сборка wheel и sdist
        run: uv build
      - name: Проверка, что колесо ставится и приложение импортируется
        run: |
          uv venv /tmp/checkenv
          VIRTUAL_ENV=/tmp/checkenv uv pip install dist/*.whl
          /tmp/checkenv/bin/python -c "from schedule_maker.main import create_app; create_app(); print('импорт ок')"
      - name: Сборка Docker-образа (проверка Dockerfile)
        run: docker build -f docker/Dockerfile -t schedule-maker:ci .
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/*

  release:
    name: Релиз
    runs-on: ubuntu-latest
    needs: [lint, test, build]
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - name: Список изменений с предыдущего тега
        id: changelog
        run: |
          PREV=$(git describe --tags --abbrev=0 "${GITHUB_REF_NAME}^" 2>/dev/null || true)
          {
            echo "notes<<CHANGELOG_EOF"
            if [ -n "$PREV" ]; then
              echo "### Изменения с $PREV"
              git log --no-merges --pretty=format:'- %s (%h)' "$PREV..${GITHUB_REF_NAME}"
            else
              echo "### Первый релиз"
              git log --no-merges --pretty=format:'- %s (%h)'
            fi
            echo ""
            echo "CHANGELOG_EOF"
          } >> "$GITHUB_OUTPUT"
      - name: Вход в GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Публикация образа
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:${{ github.ref_name }}
            ghcr.io/${{ github.repository }}:latest
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.version=${{ github.ref_name }}
      - name: Создание GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          body: |
            ${{ steps.changelog.outputs.notes }}

            ### Установка

            ```bash
            pip install schedule_maker-*.whl
            sm db upgrade && sm seed demo && sm serve
            ```

            ### Docker

            ```bash
            docker run -p 8000:8000 ghcr.io/${{ github.repository }}:${{ github.ref_name }}
            ```
          files: dist/*
          generate_release_notes: false
